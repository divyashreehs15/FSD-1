<!DOCTYPE html>
<html>
<head>
    <title>Student Marks Table</title>
</head>
<body>
    <table border="1" cellpadding="8" cellspacing="0">
        <tr>
          <th>Name</th>
          <th>Subject</th>
          <th>Marks</th>
        </tr>
        <tr>
          <td rowspan="3">Alice</td>
          <td>Math</td>
          <td>85</td>
        </tr>
        <tr> 
          <td>Science</td>
          <td>90</td>
        </tr>
        <tr>      
          <td>History</td>
          <td>88</td>               
        </tr>
        <tr>
          <td colspan="2">Bob</td>
          <td>78</td>
    </table>
</body>
</html>
