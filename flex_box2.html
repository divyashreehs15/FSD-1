<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* Flex container */
        .container {
            display: flex;
            gap: 10px;
            background: lightgrey;
            padding: 30px;
        }

        /* Flex items */
        .box1 {
            background-color: violet;
            color: white;
            padding: 20px;
            text-align: center;
            flex:1;
        }
        .box2 {
            background-color: blueviolet;
            color: white;
            padding: 20px;
            text-align: center;
            flex:2;
        }
        .box3 {
            background-color: purple;
            color: white;
            padding: 20px;
            text-align: center;
            flex:3;
        }
        .box4 {
            background-color: indigo;
            color: white;
            padding: 20px;
            text-align: center;
            flex:4;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="box1">Box 1</div>
        <div class="box2">Box 2</div>
        <div class="box3">Box 3</div>
        <div class="box4">Box 4</div>
    </div>
</body>
</html>
