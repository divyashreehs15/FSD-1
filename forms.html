<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
</head>
<body>
    <form>
        <label for="firstname">First name:</label>
        <input type="text"  name="firstname" required>
        <br><br> 
        <label for="lastname">Last name:</label>
        <input type="text"  name="lastname"  required>
        <br><br> 
        <label for="email">Email:</label>
        <input type="email"  name="email"  required>
        <br><br> 
        <label for="password">Password:</label>
        <input type="password" id="password" name="password"  required>
        <br><br>
        <input type="submit" value="Login"> 
        <br><br>

        <label for="name">Name:</label>
        <input type="text" name="name" required>
        <br><br>
        <label for ="sex">Sex:</label>
        <input type="radio" name="sex" id="male" value="male">
        <label for="male">Male</label>
        <input type="radio" name="sex" id="female" value="female">
        <label for="female">Female</label>

        <br><br>
        <label for="country">Country:</label>
        <select name="country" id="country">
            <option value="india">Select an option</option>
            <option value="india">India</option>
            <option value="usa">USA</option>
            <option value="uk">UK</option>
            <option value="canada">Canada</option>
        </select>
        <br><br>    
        <label for="message">Message:</label>
        <br><br>
        <textarea name="message" id="message" cols="30" rows="4"></textarea>
        <br><br>
        <label for="hobby">Hobbies:</label>
        <input type="checkbox" name="hobby" id="newsletter" >
        <label for="reading">Reading</label>    
        <input type="checkbox" name="hobby" id="newsletter" >
        <label for="traveling">Traveling</label>
        <input type="checkbox" name="hobby" id="newsletter" >
        <label for="cooking">Cooking</label>
        <br><br>
        <input type="submit" value="Submit">
        <br><br>

        <label for="file">Choose a file</label>
        <input type="file" id="file" name="myfile" required>
        <br><br>
        <label for="image">Upload an image:</label>
        <input type="file" id="image" name="myfile" accept="image/*" required>
        <br><br>
        <label for="docs">Upload a document</label>
        <input type="file" id="docs" name="myfile" accept=".pdf,.doc,.docx" required>
        <br><br>
        <label for="multi">Upload multiple images</label>
        <input type="file" id="multi" name="myfile" accept="image/*" multiple required>
        <br><br>
        <input type="submit" value="Upload">
        <br><br>

    </form>

</body>
</html>
