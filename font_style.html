<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>font style</title>
    <style>
        .normal{
            font-style:normal;
            font-weight:normal;
        color: chocolate;        }
        .italics{
            font-style:italic;
            font-weight:bold;
            color: crimson;
        }
        .oblique{
            font-style:oblique;
            font-weight:900;
            color: darkblue;
        }
        .bold{
            font-weight:bold;
        }
        .smallcaps{
            font-variant:small-caps;
        }
        .weight{
            font-weight:1000;
            color:yellowgreen

        }

    </style>
</head>
<body>
    <h1>Font styles</h1>
    <p class="normal" >This is a normal text.</p>
    <p class="italics">This is italics text</p>
    <p class="oblique">This is oblique text</p>
    <p class="bold">This is bold text</p>
    <p class="smallcaps">This is small caps text</p>
    <p class="weight">This shows composition of text</p>
</body>
</html>
