<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>id_selectors</title>
    <style>
         #unique{font-family: Arial, sans-serif;
        color:green;
        text-decoration:underline;
        }
    p{
        font-family: cursive;
        text-decoration: overline;
        color: orangered;
    }
    h1,h2{
        font-family: 'Times New Roman', Times, serif;
        color: rebeccapurple;
    }
    </style>
</head>
<body>
    <h1>CSS Selectors</h1>
    <h2>Element and class selectors</h2>

    <p>This is a normal paragraph.</p>
    <p class="highlight">This is a paragraph with class "highlight".</p>
    <p id="unique">Another paragraph with id "unique".</p>
   
</body>
</html>
